name: CI (skill reference checks)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check skills/scroll-world/references/scrub-engine.js
      - name: Validate safe links and navigation
        run: node --test tests/*.test.cjs
